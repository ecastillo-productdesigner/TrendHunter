name: Check standalone onboarding

on:
  push:
    branches: [Onboarding]
  pull_request:
    branches: [Onboarding]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build and check onboarding
        run: npm run check
