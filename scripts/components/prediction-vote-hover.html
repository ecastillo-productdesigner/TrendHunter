<article class="ds-panel ds-component" id="prediction-vote-hover">
  <h3>Voting button hover</h3>
  <p>I’m out and I’m in keep their black fill, labels and state-colored icons. Hover adds a 15% white overlay using buttons/tertiary/bg-hover, fading in and out over 150ms. Reduced-motion users get an immediate state change.</p>
  <div class="ds-button-examples ds-vote-examples">
    <div><button type="button" class="prediction-vote prediction-vote--out"><span class="prediction-vote-icon" aria-hidden="true"></span>I’m out</button><span>Default · Out</span></div>
    <div><button type="button" class="prediction-vote prediction-vote--out ds-vote-hover"><span class="prediction-vote-icon" aria-hidden="true"></span>I’m out</button><span>Hover · Out</span></div>
    <div><button type="button" class="prediction-vote prediction-vote--in"><span class="prediction-vote-icon" aria-hidden="true"></span>I’m in</button><span>Default · In</span></div>
    <div><button type="button" class="prediction-vote prediction-vote--in ds-vote-hover"><span class="prediction-vote-icon" aria-hidden="true"></span>I’m in</button><span>Hover · In</span></div>
  </div>
</article>
